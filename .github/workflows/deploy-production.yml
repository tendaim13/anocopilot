name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    name: Migrate Ano DB & Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations, types, and tests before release
        env:
          ANO_AGENT_MODE: disabled
        run: |
          npm run check:migrations
          npm run typecheck
          npm run test:phase4b
          npm test

      - name: Validate required production deployment & database secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANO_DATABASE_LABEL: ano
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ANO_SMOKE_AUTH_EMAIL: ${{ secrets.ANO_SMOKE_AUTH_EMAIL }}
          ANO_SMOKE_AUTH_PASSWORD: ${{ secrets.ANO_SMOKE_AUTH_PASSWORD }}
        run: npm run check:deploy-env

      - name: Apply & verify Ano Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SSL_CA: ${{ secrets.SUPABASE_DB_SSL_CA }}
          ANO_DATABASE_LABEL: ano
        run: |
          npm run db:apply:ci
          npm run db:status:ci

      - name: Build & deploy prebuilt bundle to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ANO_SMOKE_AUTH_EMAIL: ${{ secrets.ANO_SMOKE_AUTH_EMAIL }}
          ANO_SMOKE_AUTH_PASSWORD: ${{ secrets.ANO_SMOKE_AUTH_PASSWORD }}
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
          SEARXNG_GATEWAY_TOKEN: ${{ secrets.SEARXNG_GATEWAY_TOKEN }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

          DEPLOY_OUT=$(mktemp)
          DEPLOY_ERR=$(mktemp)
          if ! npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" >"$DEPLOY_OUT" 2>"$DEPLOY_ERR"; then
            cat "$DEPLOY_ERR" >&2
            cat "$DEPLOY_OUT"
            rm -f "$DEPLOY_OUT" "$DEPLOY_ERR"
            exit 1
          fi
          cat "$DEPLOY_ERR"
          cat "$DEPLOY_OUT"

          DEPLOY_URL=$(tail -n 1 "$DEPLOY_OUT" | tr -d '[:space:]')
          ALIAS_URL=$(sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "$DEPLOY_ERR" | grep -Eo 'Aliased[[:space:]]+https://[^[:space:]]+' | awk '{print $2}' | tail -n 1 | tr -d '[:space:]' || true)
          rm -f "$DEPLOY_OUT" "$DEPLOY_ERR"

          SMOKE_URL="${ALIAS_URL:-$DEPLOY_URL}"
          echo "Deployed URL: $DEPLOY_URL"
          if [ -n "$ALIAS_URL" ]; then
            echo "Production alias URL: $ALIAS_URL"
          fi

          ANO_SMOKE_BASE_URL="$SMOKE_URL" npm run smoke:production
